[target.xtensa-esp32s3-none-elf]
runner = "espflash flash --monitor -S"
rustflags = []

[target.'cfg(target_arch = "xtensa")']
runner = "espflash flash --monitor -S"

# no_std targets need core/alloc from rust-src (esp toolchain provides it).
[unstable]
build-std = ["core", "alloc"]

# Bake association credentials when building (optional; omit for scan-only STA):
#   SSID='ch6ap' PASSWORD='secret' cargo build --release --features firmware,esp32s3 \
#     --target xtensa-esp32s3-none-elf
[env]
