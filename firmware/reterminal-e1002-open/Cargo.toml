[package]
name = "e1002-open"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "FoA open-MAC concurrent STA + AWDL firmware (E1002 radio lab / companion)"
publish = false

[dependencies]
esp-hal = { version = "=1.1.2", features = ["esp32"] }
esp-rtos = { version = "0.3.0", features = ["embassy", "esp32"] }
esp-backtrace = { version = "0.19.0", features = ["panic-handler", "println", "esp32"] }
esp-println = { version = "0.17.0", default-features = false, features = [
    "critical-section",
    "uart",
    "esp32",
    "log-04",
] }
esp-alloc = "0.10.0"
esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp-rom-sys", "esp32"] }

embassy-executor = { version = "0.10.0" }
embassy-time = { version = "0.5.1" }
embassy-futures = { version = "0.1.2" }

# FoA open 802.11 stack: concurrent virtual interfaces (STA + AWDL).
# Pinned to the FoA revision that ships foa_awdl alongside foa_sta.
foa = { git = "https://github.com/esp32-open-mac/FoA", rev = "2b7ec1346548a30fa1e57cb780f666cb47693a0c", features = ["esp32", "log"] }
foa_sta = { git = "https://github.com/esp32-open-mac/FoA", rev = "2b7ec1346548a30fa1e57cb780f666cb47693a0c", features = ["esp32", "alloc", "log"] }
foa_awdl = { git = "https://github.com/esp32-open-mac/FoA", rev = "2b7ec1346548a30fa1e57cb780f666cb47693a0c", features = ["esp32", "log"] }

static_cell = "2.1.1"
log = "0.4.33"

[features]
default = ["esp32"]
esp32 = []

[profile.dev]
opt-level = "s"

[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = "fat"
opt-level = "s"
overflow-checks = false
