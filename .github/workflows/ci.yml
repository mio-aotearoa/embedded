name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  patch-series:
    name: patch series apply cleanly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Apply every series
        run: ./scripts/patches.sh apply
      - name: No series may conflict
        run: |
          set -o pipefail
          ./scripts/patches.sh status | tee /tmp/series.txt
          if grep -q 'conflicts' /tmp/series.txt; then
            echo "::error::a patch series no longer applies to its pinned commit"
            exit 1
          fi

  host-tests:
    name: host tests (hermetic)
    runs-on: ubuntu-latest
    needs: patch-series
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: nixfmt
        run: nix develop -c nixfmt --check flake.nix
      # E1002 variant/radio guards are pure Python; they need no IDF.
      - name: E1002 host tests
        run: python3 -m unittest discover -s firmware/reterminal-e1002/test -v
      - name: Build and run
        run: |
          nix build .#host-tests --print-build-logs
          ./result/bin/test_zim_archive
          ./result/bin/test_airdrop_companion
          ./result/bin/test_browser_js
          ./result/bin/test_ime_logic

  wadamesh-tests:
    name: wadamesh host suite (regressions only)
    runs-on: ubuntu-latest
    needs: patch-series
    # Upstream's own suite has ~24 link-failing tests on both Linux/g++ and
    # macOS/clang before any patch is applied, so comparing against a clean
    # baseline is the only honest gate: the series must add no new failure.
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      # Only the wadamesh series: the E1002 series has its own job.
      - name: Apply the series the suite tests
        run: ./scripts/patches.sh apply wadamesh
      - name: Suite on the patched tree
        run: |
          set -o pipefail
          TMPDIR=/tmp/wada-patched nix develop -c bash -c \
            'cd third_party/wadamesh && CXX=g++ CC=gcc bash scripts/run-host-tests.sh' \
            | tee /tmp/patched.txt || true
          grep '^failing:' /tmp/patched.txt | tr ' ' '\n' | grep '^test_' | sort > /tmp/patched-failing.txt || true
          echo "patched failures: $(wc -l < /tmp/patched-failing.txt)"
      - name: Suite on the pinned base
        run: |
          set -o pipefail
          git -C third_party/wadamesh checkout -- .
          TMPDIR=/tmp/wada-base nix develop -c bash -c \
            'cd third_party/wadamesh && CXX=g++ CC=gcc bash scripts/run-host-tests.sh' \
            | tee /tmp/base.txt || true
          grep '^failing:' /tmp/base.txt | tr ' ' '\n' | grep '^test_' | sort > /tmp/base-failing.txt || true
          echo "baseline failures: $(wc -l < /tmp/base-failing.txt)"
      - name: Fail only on new failures
        run: |
          set -o pipefail
          comm -13 /tmp/base-failing.txt /tmp/patched-failing.txt > /tmp/new.txt || true
          if [ -s /tmp/new.txt ]; then
            echo "::error::the series adds host-test failures:"
            cat /tmp/new.txt
            exit 1
          fi
          echo "no new failures (baseline $(wc -l < /tmp/base-failing.txt), patched $(wc -l < /tmp/patched-failing.txt))"

  firmware:
    name: T-Deck Plus firmware
    runs-on: ubuntu-latest
    needs: patch-series
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      # PlatformIO downloads the espressif32 platform and lib_deps on first use;
      # cache them so only a base bump pays for that again. build/duktape is a
      # network fetch too (scripts/duktape.sh), so cache it alongside.
      - uses: actions/cache@v4
        with:
          path: |
            .platformio
            build/duktape
          key: platformio-${{ hashFiles('patches/wadamesh/*.patch', 'third_party/wadamesh/platformio.ini') }}
          restore-keys: platformio-
      # nixpkgs' Linux `pio` is a bubblewrap sandbox wrapper, and Ubuntu 24.04
      # runners restrict unprivileged user namespaces. Without this, every
      # `pio run` died instantly with "bwrap: setting up uid map: Permission
      # denied"; `pio --version` alone still worked, which made it look like a
      # project error.
      - name: Allow unprivileged user namespaces
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 ||
            sudo sysctl -w kernel.unprivileged_userns_clone=1
      # If the build dies before PlatformIO starts, this says why in one screen.
      - name: Submodule state
        run: |
          git -C third_party/wadamesh rev-parse --short HEAD
          git -C third_party/wadamesh remote -v | head -2
          git -C third_party/wadamesh status --short | head -5
          ls third_party/wadamesh/platformio.ini third_party/wadamesh/scripts/build/pre_gen_baked.py
      # Separate step so a broken devShell is obvious instead of surfacing as a
      # mysterious build failure.
      - name: Toolchain
        run: nix develop -c bash -c 'echo shell ok; pio --version; g++ --version | head -1'
      - name: Build
        run: |
          set -o pipefail
          nix develop -c bash -x firmware/tdeck-plus/build.sh 2>&1 | tee /tmp/firmware.log
      # Print the tail inline and publish the first error line as an annotation,
      # so the failure is visible in the run summary without downloading
      # artifacts (which need a token).
      - name: Build log tail
        if: failure()
        run: |
          tail -n 80 /tmp/firmware.log || true
          size="$(wc -c < /tmp/firmware.log 2>/dev/null || echo missing)"
          summary="$(tail -n 6 /tmp/firmware.log 2>/dev/null | tr '\n' ' ' | tr -s ' ' | head -c 400)"
          echo "::error::firmware build (${size} bytes): ${summary:-empty log}"
      - name: Build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-build-log
          path: /tmp/firmware.log
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: tdeck-firmware
          path: third_party/out/*.bin
          if-no-files-found: error
